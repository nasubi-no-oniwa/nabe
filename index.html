<style>
/* 鍋屋ののれん：土鍋の焦げ茶、白湯の生成り、唐辛子の赤、ゆずの黄 */
:root{
  --ink:#2a160d;
  --brown:#3a1f14;
  --noren:#7a1f1a;
  --cream:#fbf1dc;
  --yuzu:#f5c518;
  --red:#d8402a;
  --green:#3f8f3a;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2a160d;color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body,button,input,#app,.overlay,.card,#hud{touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:var(--body)}
button:focus-visible{outline:3px solid var(--yuzu);outline-offset:2px}

#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:rgba(42,22,13,.9);color:var(--cream);border-radius:10px;padding:6px 11px;font-weight:900;font-size:13px;border:0;line-height:1.25}
#hRound{min-width:70px;text-align:center}
#hRound b{display:block;font-family:var(--disp);font-weight:400;font-size:18px;color:var(--yuzu)}
#hMid{flex:1;min-width:0;text-align:center}
#hMid b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--cream)}
#hMid span{font-size:11px;opacity:.85}
#hRight{text-align:right;min-width:86px}
#hTime{display:block;font-family:var(--disp);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
#hTime.low{color:#ff8a6a}
#hLadles{font-size:15px;letter-spacing:1px}
#hLadles i{font-style:normal;opacity:1}
#hLadles i.used{opacity:.22}
#shimi{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);width:min(70%,260px);background:rgba(42,22,13,.9);border-radius:999px;padding:5px 10px;color:#fff;font-weight:900;font-size:13px;text-align:center;pointer-events:none}
#shimi .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
#shimi .bar i{display:block;height:100%;width:0;background:var(--red)}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;padding:0 16px}
#msgBig{font-family:var(--disp);font-size:clamp(38px,12vw,64px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#msgBig.good{color:var(--yuzu)}
#msgBig.bad{color:#9fc6e8}
#msgSub{margin-top:8px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;background:rgba(42,22,13,.9);color:var(--cream);font-weight:900;font-size:15px;padding:10px 16px;border-radius:999px;border:2px solid var(--yuzu);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);text-align:center;font-family:var(--disp);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:popup 1.6s ease-out forwards;white-space:nowrap}
.pop b{display:block;font-weight:400;font-size:clamp(30px,9vw,44px);color:var(--yuzu)}
.pop small{display:block;font-family:var(--body);font-weight:900;font-size:13px;-webkit-text-stroke:0;text-shadow:0 1px 3px #000;color:#fff;line-height:1.35}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}

.overlay{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:safe center;background:rgba(42,22,13,.5);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.card{position:relative;width:min(100%,420px);background:var(--cream);border-radius:16px;padding:22px 18px 18px;text-align:center;box-shadow:0 0 0 4px var(--brown),0 18px 40px rgba(0,0,0,.45)}
.noren{position:absolute;left:14px;right:14px;top:-4px;height:30px;display:flex;gap:4px;justify-content:center}
.noren i{flex:1;background:var(--noren);border-radius:0 0 6px 6px}
.card h1{font-family:var(--disp);font-weight:400;font-size:clamp(36px,11.5vw,52px);line-height:1.1;margin:30px 0 0;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.sub{font-weight:900;font-size:14px;margin:10px 0 0}
.card h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:24px 0 0;line-height:1.25}
.big{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-size:clamp(18px,5.6vw,22px);background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 14px 13px;cursor:pointer;box-shadow:0 4px 0 #8e2a1b;white-space:nowrap}
.big.k{background:var(--yuzu);color:var(--ink);box-shadow:0 4px 0 #9b7c00}
.big.alt{background:transparent;color:var(--ink);border:2px solid var(--brown);box-shadow:none;font-size:16px;padding:9px}
.big.x{background:#000;color:#fff;box-shadow:0 4px 0 #444;font-size:17px}
.big:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--ink);border:1.5px solid rgba(42,22,13,.45);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.how{margin:14px 0 0;padding:10px 12px;background:#fff;border-radius:10px;text-align:left;font-size:13px;font-weight:700;line-height:1.6}
.how b{color:var(--red)}

/* 鍋えらび */
.pots{display:grid;gap:8px;margin-top:14px}
.pot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:#fff;box-shadow:0 3px 0 rgba(42,22,13,.35);cursor:pointer;color:var(--ink)}
.pot .bowl{width:52px;height:52px;border-radius:50%;border:6px solid #3b2a22;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.pot b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.2}
.pot small{display:block;font-weight:700;font-size:12px;line-height:1.4;color:#6b4a35}
.pot em{font-style:normal;font-weight:900;font-size:12px;color:var(--red)}

/* 具材カード */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.ing{position:relative;border:0;border-radius:12px;padding:10px 6px 9px;background:#fff;box-shadow:0 3px 0 rgba(42,22,13,.35);cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px}
.ing .rr{font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;background:#e8dcc4}
.ing.r1 .rr{background:#bfe0ff}
.ing.r2 .rr{background:var(--yuzu)}
.ing.r2{box-shadow:0 3px 0 #9b7c00,0 0 0 2px var(--yuzu)}
.ing .ico{width:40px;height:40px;border-radius:50%}
.ing b{font-family:var(--disp);font-weight:400;font-size:15px;line-height:1.15}
.ing small{font-size:11px;font-weight:700;line-height:1.35;color:#6b4a35}
.ing .pts{font-weight:900;font-size:12px;color:var(--red)}
.ing .tag{position:absolute;top:-8px;right:-4px;font-size:10px;font-weight:900;color:#fff;background:var(--green);border-radius:6px;padding:0 5px}
.box{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
.box span{font-size:12px;font-weight:900;background:#fff;border-radius:999px;padding:3px 9px;box-shadow:0 1px 0 rgba(42,22,13,.3)}
.box span.kira{background:var(--yuzu)}
.box button{font:900 12px var(--body);background:#fff;border:2px solid var(--red);color:var(--red);border-radius:999px;padding:3px 9px;cursor:pointer}
.small-note{font-size:12px;font-weight:700;color:#6b4a35;margin:8px 0 0}

.res-big{font-family:var(--disp);font-size:clamp(26px,8.5vw,40px);line-height:1.05;margin:26px 0 0;color:var(--red)}
.res-score{font-family:var(--disp);font-size:52px;font-variant-numeric:tabular-nums;line-height:1;margin-top:8px}
.res-score small{font-family:var(--body);font-weight:900;font-size:16px;margin-left:4px}
.rounds{display:flex;gap:4px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.rounds span{font-size:12px;font-weight:900;background:#fff;border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;font-weight:700;font-size:13px;min-height:1.2em}
.note.err{color:var(--red)}
.entry{display:flex;gap:8px;margin-top:12px}
.entry input{flex:1;min-width:0;font:700 16px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--brown);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.entry button{font:900 15px var(--body);background:var(--brown);color:var(--cream);border:0;border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.entry button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;font:900 13px var(--body);background:#fff;color:var(--ink);border:2px solid var(--brown);border-radius:10px;padding:6px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-pressed="true"]{background:var(--brown);color:var(--cream)}
.rlist{list-style:none;margin:10px 0 0;padding:0;max-height:min(40vh,320px);overflow-y:auto;text-align:left;border-top:2px solid var(--brown)}
.rlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid rgba(42,22,13,.2)}
.rlist .no{font-family:var(--disp);text-align:center;color:var(--red)}
.rlist .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .sc{font-family:var(--disp);font-size:16px;font-variant-numeric:tabular-nums}
.rlist .me .nm{color:var(--red)}
.rempty{padding:14px 0;font-weight:700;text-align:center;display:block!important}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--cream);background:#2a160d}
@media (prefers-reduced-motion:reduce){#flash{transition:none}.pop{animation-duration:1.2s}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="pops"></div>
  <div id="flash"></div>
  <div id="hud" hidden>
    <div class="chip" id="hRound"><span data-i="round">ラウンド</span><b id="hRoundN">1/5</b></div>
    <div class="chip" id="hMid"><b id="hScore">0</b><span id="hPot"></span></div>

  <!-- タイトル -->
  <div class="overlay" id="titleP">
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <h1 data-ih="titleH">なべなべ<br><em>すくい</em></h1>
      <p class="sub" data-i="sub">切って、煮て、すくえ。</p>
      <div class="how" data-ih="how"></div>
      <div class="pots" id="potList"></div>
      <button class="big alt" id="goRank" data-i="rank">ランキング</button>
      <div class="langs" role="group" aria-label="Language"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">繁中</button><button data-lang="ko">한국어</button></div>
    </div>
  </div>

  <!-- 具材えらび -->
  <div class="overlay" id="pickP" hidden>
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <h2 id="pickH"></h2>
      <p class="small-note" data-i="pickSub">えらんだ具材を切って、鍋に足します</p>

      <p class="small-note" data-i="inPot">いま鍋に入っている具材</p>
      <div class="box" id="boxNow"></div>
    </div>
  </div>

  <!-- 入れかえ -->
  <div class="overlay" id="swapP" hidden>
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <h2 data-i="swapH">鍋がいっぱい</h2>
      <p class="small-note" id="swapSub"></p>
      <div class="box" id="swapBox"></div>
      <button class="big alt" id="swapCancel" data-i="swapCancel">やっぱりやめる</button>
    </div>
  </div>

  <!-- ラウンドおわり -->
  <div class="overlay" id="roundP" hidden>
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="res-big" id="roundH"></p>
      <div class="res-score" id="roundS"></div>
      <p class="note" id="roundSub"></p>
      <button class="big" id="roundNext" data-i="next">次のラウンドへ</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="overlay" id="resP" hidden>
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="res-big" id="resH"></p>
      <div class="res-score" id="resS"></div>
      <p class="note" id="resSub"></p>
      <div class="rounds" id="resRounds"></div>
      <button class="big x" id="resShare" data-i="share">Xに投稿</button>
      <div class="entry"><input id="nameIn" maxlength="12" data-ip="namePh" placeholder="名前（12文字まで）" autocomplete="nickname"><button id="send" data-i="send">登録</button></div>
      <p class="note" id="sendMsg"></p>
      <ol class="rlist" id="rlist"></ol>
      <div class="row2"><button class="big" id="resRetry" data-i="retry">もう一回</button><button class="big alt" id="resTitle" data-i="toTitle">タイトルへ</button></div>
    </div>
  </div>

  <!-- ランキング -->
  <div class="overlay" id="rankP" hidden>
    <div class="card">
      <div class="noren"><i></i><i></i><i></i><i></i><i></i></div>
      <h2 data-i="rank">ランキング</h2>
      <div class="tabs" id="rankTabs"></div>
      <ol class="rlist" id="rlist2"></ol>
      <button class="big alt" id="rankBack" data-i="toTitle">タイトルへ</button>
    </div>
  </div>

  <div id="loading">…</div>
</div>

// items: [{id, kira, born}]  ctx: {pot, t(ラウンド経過秒)}
function scoreScoop(items, ctx) {
  const tags = [];
  if (!items.length) return { total: 0, tags };
  const n = items.length, cnt = id => items.filter(x => x.id === id).length;
  const nC = items.filter(x => ING[x.id].t === 'c').length;
  const negi = cnt('negi'), kujo = cnt('kujo') > 0, jidori = cnt('jidori') > 0, kawa = cnt('kawa');
  let total = 0;
  for (const it of items) {
    const g = ING[it.id]; let v = g.base + (it.umami || 0);
    switch (it.id) {
      case 'mune': v += 5 * (nC - 1); break;
      case 'tebasaki': if (n === 1) { v *= 3; tags.push(tr('alone')); } break;
      case 'tsukune': v += 15 * (cnt('tsukune') - 1); break;
      case 'hakusai': v += 3 * n; break;
      case 'ninjin': if (cnt('daikon')) v += 20; break;
      case 'daikon': v += Math.min(40, Math.floor(4 * Math.max(0, ctx.t - it.born))); break;
      case 'enoki': v += 4 * (cnt('enoki') - 1); break;
      case 'shungiku': v = nC ? v + 10 : v / 2; break;
    }
    if (g.t === 'c') { v += 10 * negi; if (jidori) v *= 1.5; if (kujo) v *= 2; if (ctx.pot === 1) v *= 1.5; }
    else if (ctx.pot === 2) v *= 1.5;
    if (it.kira) v *= 2;
    total += v;
  }
  if (negi && nC) tags.push(ingName('negi') + ' +' + 10 * negi);
  if (jidori && nC) tags.push(ingName('jidori') + ' ×1.5');
  if (kujo && nC) tags.push(ingName('kujo') + ' ×2');
  if (cnt('tsukune') > 1) tags.push(ingName('tsukune') + ' ×' + cnt('tsukune'));
  if (kawa) { total *= 1 + .1 * kawa; tags.push(ingName('kawa') + ' +' + 10 * kawa + '%'); }
  if (n >= 5) { total *= 1.2; tags.push(tr('combo5') + ' ×1.2'); }
  if (ctx.pot === 3) { total *= 1.3; if (ctx.t < SHIMI_T) { total *= .5; tags.push(tr('shimiEarly')); } }
  const k = items.filter(x => x.kira).length; if (k) tags.unshift('✨×' + k);
  return { total: Math.round(total), tags };
}

  SC = { t: 0, left: 0, items: deco.map(d => ({ id: 'momo', obj: d.o, a: d.a, r: d.r, w: d.w, ph: Math.random() * 6, drop: false, vy: 0, umami: 0 })), grabbed: [], ended: true, lifting: 0 };
}
resize(); setCam('title', true); applyLang();
$('#loading').hidden = true;
requestAnimationFrame(frame);
// ?pot=2 で直接その鍋のランキングを見せる
if (QS.has('debug')) window.NB = { cut: () => CUT, sc: () => SC, run: () => RUN, score: scoreScoop };
const qp = +QS.get('pot'); if (qp >= 1 && qp <= 3) { rankTab = qp; }
